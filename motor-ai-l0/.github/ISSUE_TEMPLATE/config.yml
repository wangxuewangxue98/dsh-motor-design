# 先看 Issue 模板
请勿直接开空白 issue —— 上面三个模板能让你一次说清要什么，作者也能一次改对。

| 你遇到的是 | 用哪个模板 |
|---|---|
| 校验结果与物理预期不符、插件行为异常 | 🐛 问题反馈 |
| 你的工况跑不出方案 / 结论明显不合理 | 📊 案例反馈 |
| 想贡献回归用例或标定数据 | 🧪 回归用例 / 标定数据 |

# 提交前请确认

1. **不要粘贴设计明细**（外径/内径/槽数/匝数/电流/效率数值）。这些是你的工况资产，
   对修复没有帮助，只会暴露你的数据。工况且**要**给——那是复现必需的。
2. **不要粘贴本机绝对路径**（`C:\Users\...`）。
3. 一句话说明物理依据的 issue，修复速度通常快一个数量级。

# 自动上报

本项目**永远不会**自动向远端提交你的数据。
反馈一律由你本人粘贴、人工署名。理由：自动上报是信任的重灾区，
作者需要收到有人愿意署名的内容。