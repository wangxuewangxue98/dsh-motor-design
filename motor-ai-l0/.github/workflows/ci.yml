name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # 每周二 01:30 UTC（北京 09:30）对 npm latest 做跨版本对比
    - cron: '30 1 * * 2'
  workflow_dispatch:
    inputs:
      against:
        description: 'cmp 对比的 npm 版本号（留空跳过 cmp）'
        required: false
        default: ''

jobs:
  gate:
    name: 单测 + 门禁
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # 插件 peerDeps 是 DSH 宿主（本就不随包安装），跳过 peer 解析
      - name: 安装依赖
        run: npm install --legacy-peer-deps --no-audit --no-fund
      - name: 单测
        run: node --test
      - name: 门禁（95 项）
        run: node scripts/verify.mjs

  cmp:
    name: 跨版本对比（--cmp，防修复被误读为回退）
    runs-on: ubuntu-latest
    needs: gate
    # 定时、手动（显式传 against）、或 main 分支 push（对 npm latest 做回归哨兵）
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.against != '') || github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 取 npm latest 版本号
        id: ver
        run: echo "v=$(npm view dsh-motor-ai-l0 version --registry=https://registry.npmjs.org)" >> "$GITHUB_OUTPUT"
      - name: 跨版本对比
        # 对比对象：手动输入优先；定时/push 时对 npm latest。
        # 若 HEAD 版本号 == 对比版本号（尚未发新版），自比必过，起 smoke 作用。
        run: node scripts/cmp.mjs --against "${{ inputs.against || steps.ver.outputs.v }}"
