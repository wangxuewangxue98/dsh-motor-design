<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1565C0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0D47A1;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="motorGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E3F2FD;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Background circle -->
  <circle cx="256" cy="256" r="240" fill="url(#bgGrad)" filter="url(#shadow)"/>
  
  <!-- Motor cross-section (simplified) -->
  <g transform="translate(256, 256)">
    <!-- Stator outer ring -->
    <circle cx="0" cy="0" r="140" fill="none" stroke="#FFFFFF" stroke-width="24" opacity="0.9"/>
    
    <!-- Stator teeth (8 teeth for 4-pole representation) -->
    <g fill="#FFFFFF" opacity="0.85">
      <rect x="-12" y="-130" width="24" height="40" rx="4"/>
      <rect x="-12" y="90" width="24" height="40" rx="4"/>
      <rect x="-130" y="-12" width="40" height="24" rx="4"/>
      <rect x="90" y="-12" width="40" height="24" rx="4"/>
      <g transform="rotate(45)">
        <rect x="-12" y="-130" width="24" height="40" rx="4"/>
      </g>
      <g transform="rotate(-45)">
        <rect x="-12" y="-130" width="24" height="40" rx="4"/>
      </g>
    </g>
    
    <!-- Rotor inner ring -->
    <circle cx="0" cy="0" r="80" fill="none" stroke="#10B981" stroke-width="16" opacity="0.9"/>
    
    <!-- Shaft -->
    <circle cx="0" cy="0" r="25" fill="#10B981"/>
    
    <!-- PM symbols (N/S poles) -->
    <g font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="middle">
      <text x="0" y="-50">N</text>
      <text x="0" y="50">S</text>
    </g>
  </g>
  
  <!-- Lightning bolt (speed/millisecond) -->
  <g transform="translate(380, 120)" filter="url(#shadow)">
    <polygon points="0,-30 -15,10 -5,10 -20,40 15,-5 5,-5 20,-30" fill="#F9A825"/>
  </g>
  
  <!-- Text label -->
  <text x="256" y="460" font-family="Microsoft YaHei, Arial, sans-serif" font-size="28" font-weight="bold" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">MOTOR-AI L0</text>
</svg>
